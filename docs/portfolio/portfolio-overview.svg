<title id="title">Enterprise AI: strategy, automation, governance and evaluation</title>
<desc id="desc">Dashed relationships connect the business assessment conceptually to the two technical cases. A solid arrow from the separate confirmed Agent CLI to the Hub represents the tested local HTTP integration. The model has no action tools.</desc>
